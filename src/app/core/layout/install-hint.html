@if (visible()) {
  <aside
    aria-label="Aviso sobre tu progreso"
    class="mx-auto max-w-6xl px-4 pt-3 sm:px-6"
  >
    <div
      class="flex items-start gap-3 rounded-2xl border border-gold/25 bg-deep/90 py-1 pr-1 pl-4 text-sm"
    >
      <app-icon name="info" [size]="18" class="mt-3 text-gold" />
      <div
        class="flex min-w-0 flex-1 flex-wrap items-center gap-x-4 gap-y-1 py-1"
      >
        <p class="min-w-0 flex-1 basis-60 py-1.5 leading-snug text-mist">
          {{ message() }}
        </p>
        @if (hint() === 'install') {
          <button
            type="button"
            class="inline-flex min-h-11 shrink-0 items-center gap-2 rounded-full bg-gold px-4 font-medium text-night transition-colors hover:bg-gold/85"
            (click)="install()"
          >
            <app-icon name="install" [size]="18" />
            Instalar AguiNews
          </button>
        }
      </div>
      <button
        type="button"
        aria-label="Cerrar aviso"
        class="grid size-11 shrink-0 place-items-center rounded-full text-mist transition-colors hover:bg-white/5 hover:text-ice"
        (click)="dismiss()"
      >
        <app-icon name="close" [size]="18" />
      </button>
    </div>
  </aside>
}
