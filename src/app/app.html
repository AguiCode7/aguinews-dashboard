<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-full focus:bg-cyan focus:px-4 focus:py-2 focus:text-night"
  >Saltar al contenido</a
>

<header class="relative">
  <span
    aria-hidden="true"
    class="pointer-events-none absolute inset-x-0 top-0 h-48 bg-linear-to-b from-petrol/20 to-transparent"
  ></span>
  <div
    class="relative mx-auto flex max-w-4xl flex-col items-center gap-1.5 px-4 pt-6 pb-6 text-center sm:gap-2 sm:pt-10 sm:pb-8"
  >
    <a routerLink="/" class="shrink-0">
      <img
        ngSrc="brand/aguinews-logo.webp"
        alt="AguiNews, ir a la portada"
        width="680"
        height="240"
        priority
        class="h-16 w-auto sm:h-24"
      />
    </a>
    <p class="text-sm font-semibold text-gold sm:text-base">
      Las noticias de tecnología del día, resumidas
    </p>
  </div>
</header>

<main id="main" tabindex="-1" class="focus:outline-none">
  <router-outlet />
</main>

<footer class="border-t border-white/5">
  <div
    class="mx-auto flex max-w-4xl flex-col gap-4 px-4 py-8 text-sm text-mist sm:flex-row sm:items-center"
  >
    <img
      ngSrc="agui/agui-waving.webp"
      alt=""
      width="57"
      height="96"
      class="h-12 w-auto self-start sm:self-auto"
    />
    <p class="flex-1">
      Resúmenes generados cada día con n8n e inteligencia artificial. Hecho con
      Angular por AguiCode, © {{ year }}.
    </p>
    <nav aria-label="AguiCode" class="flex gap-4">
      <a
        [href]="channelUrl"
        target="_blank"
        rel="noopener"
        class="py-2.5 font-medium text-cyan hover:underline"
        >YouTube</a
      >
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener"
        class="py-2.5 font-medium text-cyan hover:underline"
        >GitHub</a
      >
    </nav>
  </div>
</footer>
